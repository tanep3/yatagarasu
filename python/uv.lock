    { name = "faster-whisper" },
    { name = "numpy" },
    { name = "onvif-zeep" },
    { name = "sentence-transformers" },
    { name = "sentencepiece" },
    { name = "silero-vad" },
    { name = "torch", version = "2.13.0", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'darwin'" },
    { name = "torch", version = "2.13.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform != 'darwin'" },
    { name = "torchaudio", version = "2.11.0", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'darwin'" },
    { name = "torchaudio", version = "2.11.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform != 'darwin'" },
    { name = "transformers" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-cov" },
]

[package.metadata]
requires-dist = [
    { name = "faster-whisper", specifier = ">=1.1.0" },
    { name = "numpy", specifier = ">=2.1.0" },
    { name = "onvif-zeep", specifier = ">=0.2.12" },
    { name = "sentence-transformers", specifier = ">=5.0.0" },
    { name = "sentencepiece", specifier = ">=0.2.0" },
    { name = "silero-vad", specifier = ">=5.1.2" },
    { name = "torch", specifier = ">=2.2.0", index = "https://download.pytorch.org/whl/cpu" },
    { name = "torchaudio", specifier = ">=2.2.0", index = "https://download.pytorch.org/whl/cpu" },
    { name = "transformers", specifier = ">=4.48.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=9.0.2" },
    { name = "pytest-cov", specifier = ">=7.0.0" },
]

